spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopping?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    # ⚠️ 密码【故意不写在这里】，别加回来！
    #    这里只要写了任何值（哪怕是个占位符 your_password），它的优先级都【高于】
    #    application.yml 里 spring.config.import: optional:classpath:application-local.yml
    #    导进来的那份配置，会把真实密码压掉 → 启动直接报
    #    「Access denied for user 'root'@'localhost' (using password: YES)」→ 进程立刻退出。
    #    真实密码放在本机的 application-local.yml（已被 .gitignore 排除、不会上传 GitHub），
    #    新建时照同目录的 application-local.yml.example 抄即可。
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
      encoding: UTF-8

logging:
  level:
    com.scaffold: debug
